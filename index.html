<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aditi Bhardwaj — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:      #2563EB;
    --primary-deep: #1D4ED8;
    --bg:           #F4F6F8;
    --soft:         #DBEAFE;
    --softer:       #EFF6FF;
    --text:         #0F172A;
    --muted:        #475569;
    --line:         #E2E8F0;
    --shadow:       0 8px 24px rgba(0,0,0,0.08);
    --font-heading: 'Inter', sans-serif;
    --font-body:    'Inter', sans-serif;
    --radius-card:  10px;
    --radius-btn:   8px;
  }
  *  { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); overflow-x:hidden; }
  h1,h2,h3 { font-family:var(--font-heading); color:var(--text); margin:0; }
  a { color:var(--primary-deep); }

  .nav {
    position:sticky; top:0; z-index:50;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 6vw;
  }
  .brand { font-weight:700; font-size:18px; font-family:var(--font-heading); color:var(--text); text-decoration:none; }
  .nav-links { display:flex; gap:22px; list-style:none; margin:0; padding:0; font-size:14px; font-weight:500; }
  .nav-links a { text-decoration:none; color:var(--muted); transition:.2s; }
  .nav-links a:hover { color:var(--primary); }
  @media(max-width:700px) { .nav-links { display:none; } }

  .hero {
    padding:90px 6vw 100px; text-align:center;
    background:linear-gradient(180deg,var(--softer) 0%,var(--bg) 100%);
  }
  .hero h1 { font-size:clamp(30px,5vw,52px); font-weight:700; line-height:1.1; }
  .hero h1 span { color:var(--primary); }
  .hero p { max-width:560px; margin:18px auto 0; font-size:16px; color:var(--muted); line-height:1.75; }
  .btn-primary {
    display:inline-flex; align-items:center; gap:8px;
    background:var(--primary); color:#fff;
    border:none; padding:12px 24px; border-radius:var(--radius-btn);
    font-family:var(--font-body); font-weight:600; font-size:14px;
    cursor:pointer; transition:.2s; text-decoration:none; margin-top:28px;
  }
  .btn-primary:hover { background:var(--primary-deep); transform:translateY(-2px); }

  section { padding:80px 6vw; }
  .section-head { text-align:center; margin:0 auto 48px; }
  .kicker { font-size:12px; font-weight:600; letter-spacing:.07em; color:var(--primary-deep); text-transform:uppercase; margin-bottom:8px; }
  .section-head h2 { font-size:clamp(22px,3.5vw,32px); font-weight:600; }
  .bg-alt { background:var(--softer); }

  .about-wrap {
    max-width:800px; margin:0 auto; background:#fff;
    border-radius:var(--radius-card); padding:36px 6vw;
    box-shadow:var(--shadow);
  }
  .about-wrap p { color:var(--muted); font-size:15px; line-height:1.85; margin:0 0 12px; }

  .timeline { max-width:700px; margin:0 auto; position:relative; padding-left:34px; }
  .timeline::before {
    content:""; position:absolute; left:10px; top:6px; bottom:6px; width:2px;
    background:var(--line);
  }
  .t-item { position:relative; padding-bottom:34px; }
  .t-item:last-child { padding-bottom:0; }
  .t-dot {
    position:absolute; left:-34px; top:2px; width:24px; height:24px; border-radius:50%;
    background:var(--primary); box-shadow:0 0 0 4px var(--soft);
  }
  .t-card { background:#fff; border-radius:var(--radius-card); padding:18px 20px; box-shadow:var(--shadow); }
  .t-date { font-size:11px; font-weight:600; color:var(--primary-deep); background:var(--soft); display:inline-block; padding:2px 10px; border-radius:10px; margin-bottom:8px; }
  .t-role { font-size:16px; font-weight:600; font-family:var(--font-heading); }
  .t-org { font-size:13px; color:var(--muted); margin-bottom:8px; }
  .t-card ul { margin:0; padding-left:16px; color:var(--muted); font-size:13px; line-height:1.75; }
  .t-card li::marker { color:var(--primary); }

  .skills-wrap { max-width:800px; margin:0 auto; text-align:center; }

  .portfolio-grid { max-width:1000px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; }
  .proj-card { background:#fff; border-radius:var(--radius-card); padding:22px; box-shadow:var(--shadow); display:flex; flex-direction:column; }
  .proj-card h3 { font-size:16px; margin-bottom:6px; }
  .proj-card .proj-desc { color:var(--muted); font-size:13px; line-height:1.6; margin-bottom:12px; flex-grow:1; }
  .proj-link { align-self:flex-start; font-size:13px; font-weight:600; color:var(--primary-deep); text-decoration:none; }
  .proj-link:hover { text-decoration:underline; }

  footer {
    background:#0F172A; color:rgba(255,255,255,0.8);
    padding:44px 6vw 28px; text-align:center;
  }
  .footer-brand { font-family:var(--font-heading); font-size:20px; color:#fff; margin-bottom:10px; }
  .footer-links { display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin:14px 0; font-size:13px; }
  .footer-links a { color:rgba(255,255,255,0.7); text-decoration:none; }
  .footer-links a:hover { color:#fff; }
  .footer-fine { font-size:11px; color:rgba(255,255,255,0.3); margin-top:20px; }
  @media(max-width:600px) { section { padding:60px 5vw; } }
</style>
</head>
<body>

<nav class="nav">
  <a href="#" class="brand">Aditi Bhardwaj</a>
  <ul class="nav-links">
    
    
    
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<div class="hero">
  <p class="kicker">✦ Portfolio</p>
  <h1>Hi, I'm <span>Aditi Bhardwaj</span></h1>
  <p>Devops Engineer</p>
  
</div>







<section id="contact">
  <div class="section-head">
    <div class="kicker">Connect</div>
    <h2>Get in touch</h2>
  </div>
  <div style="text-align:center;font-size:15px;color:var(--muted);">Add your contact details to get started.</div>
</section>

<footer>
  <div class="footer-brand">Aditi Bhardwaj</div>
  <p style="font-size:14px;opacity:.7;max-width:400px;margin:0 auto">Devops Engineer</p>
  <div class="footer-links"></div>
  <p class="footer-fine">Built with <a href="https://aditibhardwaj.co" style="color:rgba(255,255,255,.4)">Aditi Bhardwaj &amp; Co.</a> &nbsp;·&nbsp; © 2026 Aditi Bhardwaj</p>
</footer>

</body>
</html>
